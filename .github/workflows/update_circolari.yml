name: Aggiorna Circolari Belvedere

on:
  schedule:
    # Controlli ogni 2 ore dalle 08:00 alle 21:00 lun-sab (inclusa fascia serale per ordinanze meteo)
    - cron: '0 7,9,11,13,15,17,19,20 * * 1-6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Tesseract OCR (ita) & Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ita
          pip install --no-cache-dir requests beautifulsoup4 pymupdf pytesseract Pillow

      - name: Check & parse new circulars
        run: python cloud_update.py

      - name: Commit and push updates if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json index.html
          if ! git diff --staged --quiet; then
            git commit -m "chore: aggiornamento automatico circolari Belvedere"
            git push
          else
            echo "Nessuna nuova circolare da pubblicare."
          fi
