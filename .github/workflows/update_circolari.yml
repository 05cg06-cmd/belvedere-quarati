name: Aggiorna Circolari Belvedere

on:
  schedule:
    # 4 controlli al giorno tra le 8 e le 18 lun-sab (08:00/11:00/14:00/17:00 CET; 09:00/12:00/15:00/18:00 CEST)
    - cron: '0 7,10,13,16 * * 1-6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Tesseract OCR (ita) & Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ita
          pip install --no-cache-dir requests beautifulsoup4 pymupdf pytesseract Pillow

      - name: Check & parse new circulars
        run: python cloud_update.py

      - name: Commit and push updates if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json index.html
          if ! git diff --staged --quiet; then
            git commit -m "chore: aggiornamento automatico circolari Belvedere"
            git push
          else
            echo "Nessuna nuova circolare da pubblicare."
          fi
