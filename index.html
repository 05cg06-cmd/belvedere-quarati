<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Belvedere Quarati — App Genitori</title>
<meta name="theme-color" content="#162e5c" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Belvedere" />
<link rel="manifest" href="./manifest.json" />
<link rel="apple-touch-icon" href="./icon-192.png" />
<style>
  :root {
    --bg: #f4f6fb;
    --card: #ffffff;
    --ink: #162238;
    --muted: #5a6782;
    --border: #dfe5f1;
    --primary: #1d4ed8;
    --navy: #162e5c;
    --green: #16a34a;
    --green-soft: #dcfce7;
    --red: #dc2626;
    --red-soft: #fee2e2;
    --orange: #ea580c;
    --orange-soft: #ffedd5;
    --amber: #d97706;
    --amber-soft: #fef3c7;
    --purple: #7c3aed;
    --purple-soft: #ede9fe;
    --slate: #475569;
    --slate-soft: #e2e8f0;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.45;
    padding-bottom: calc(78px + env(safe-area-inset-bottom));
  }
  .app-header {
    background: linear-gradient(135deg, #162e5c 0%, #1d4ed8 100%);
    color: #fff;
    padding: calc(14px + env(safe-area-inset-top)) 16px 14px;
    position: sticky;
    top: 0;
    z-index: 40;
    box-shadow: 0 4px 16px rgba(22, 46, 92, 0.18);
  }
  .head-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; max-width: 1120px; margin: 0 auto; }
  .head-title h1 { margin: 0; font-size: 1.08rem; font-weight: 800; }
  .head-title small { opacity: 0.88; font-size: 0.78rem; display: block; }
  .head-btns { display: flex; gap: 6px; }
  .icon-btn {
    border: 1px solid rgba(255,255,255,0.25);
    background: rgba(255,255,255,0.16);
    color: #fff;
    border-radius: 10px;
    padding: 7px 10px;
    font-size: 0.8rem;
    font-weight: 700;
    cursor: pointer;
  }
  .icon-btn.wa { background: #16a34a; border-color: #16a34a; }

  .kids-bar {
    max-width: 1120px;
    margin: 10px auto 0;
    display: flex;
    align-items: center;
    gap: 6px;
    overflow-x: auto;
    padding-bottom: 2px;
    scrollbar-width: none;
  }
  .kids-bar::-webkit-scrollbar { display: none; }
  .kids-lbl { font-size: 0.74rem; font-weight: 700; white-space: nowrap; opacity: 0.9; }
  .kid-pill {
    border: 1px solid rgba(255,255,255,0.3);
    background: rgba(255,255,255,0.12);
    color: #fff;
    border-radius: 999px;
    padding: 4px 10px;
    font-size: 0.78rem;
    font-weight: 700;
    white-space: nowrap;
    cursor: pointer;
  }
  .kid-pill.active { background: #fff; color: var(--navy); border-color: #fff; }

  .wrap { max-width: 1120px; margin: 0 auto; padding: 14px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 12px;
    box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
  }
  .card h2 { margin: 0 0 8px; font-size: 1rem; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .card-sub { font-size: 0.8rem; color: var(--muted); }

  /* Semaforo Oggi & Domani */
  .semaforo-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px; }
  .sem-box {
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
    background: #f8fafc;
  }
  .sem-box.alert { background: #fef2f2; border-color: #fecaca; border-left: 5px solid var(--red); }
  .sem-box.warn { background: #fffbeb; border-color: #fde68a; border-left: 5px solid var(--amber); }
  .sem-box.ok { background: #f0fdf4; border-color: #bbf7d0; border-left: 5px solid var(--green); }
  .sem-day { font-size: 0.76rem; text-transform: uppercase; font-weight: 800; color: var(--muted); letter-spacing: 0.04em; }
  .sem-status { font-size: 1rem; font-weight: 800; margin: 4px 0; }
  .sem-detail { font-size: 0.82rem; color: var(--ink); }

  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 10px; }
  .metrics-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 8px 0; }
  .m-box { background: #f8fafc; border: 1px solid #edf2f7; border-radius: 10px; padding: 7px 8px; }
  .m-lbl { font-size: 0.7rem; color: var(--muted); font-weight: 700; }
  .m-val { font-size: 0.96rem; font-weight: 800; }
  .m-val.red { color: var(--red); }
  .m-val.green { color: var(--green); }
  .cat-chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .chip { font-size: 0.74rem; font-weight: 700; padding: 3px 8px; border-radius: 8px; background: var(--slate-soft); }
  .chip.ref { background: var(--orange-soft); color: #9a3412; }
  .chip.ass { background: var(--red-soft); color: #991b1b; }
  .chip.bomba { background: #ffe4e6; color: #881337; }
  .chip.stag { background: var(--amber-soft); color: #92400e; }

  .pill-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 10px; }
  .pill {
    border: 1px solid var(--border); background: #fff; color: var(--ink);
    padding: 6px 11px; border-radius: 999px; font-size: 0.82rem; font-weight: 700; cursor: pointer;
  }
  .pill.active { background: var(--primary); color: #fff; border-color: var(--primary); }

  .btn {
    border: 1px solid var(--border); background: #fff; color: var(--ink);
    border-radius: 10px; padding: 8px 12px; font-weight: 700; font-size: 0.84rem; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px; text-decoration: none;
  }
  .btn.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
  .btn.wa { background: var(--green); color: #fff; border-color: var(--green); }

  /* Calendario */
  .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
  .cal-dow { text-align: center; font-size: 0.74rem; font-weight: 700; color: var(--muted); }
  .day-cell {
    background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 6px;
    min-height: 88px; display: flex; flex-direction: column; justify-content: space-between; cursor: pointer;
  }
  .day-cell.empty { background: transparent; border: none; cursor: default; }
  .day-cell.weekend { background: #f8fafc; color: #94a3b8; }
  .day-cell.ponte, .day-cell.festivita { background: #f1f5f9; border-style: dashed; border-color: #cbd5e1; }
  .day-cell.has-loss { border-left: 4px solid var(--red); }
  .day-cell.has-ref { border-left: 4px solid var(--orange); }
  .day-cell.has-strike { border-left: 4px solid var(--amber); }
  .day-top { display: flex; justify-content: space-between; align-items: center; gap: 2px; }
  .day-num { font-weight: 800; font-size: 0.88rem; }
  .badge { font-size: 0.65rem; font-weight: 700; padding: 2px 5px; border-radius: 999px; white-space: nowrap; }
  .b-ok { background: var(--green-soft); color: #166534; }
  .b-loss { background: var(--red-soft); color: #991b1b; }
  .b-ref { background: var(--orange-soft); color: #9a3412; }
  .b-ponte { background: var(--slate-soft); color: #334155; }
  .b-strike { background: var(--amber-soft); color: #92400e; }
  .day-events { font-size: 0.7rem; overflow: hidden; margin: 3px 0; }
  .ev-line { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar-wrap { height: 7px; border-radius: 999px; background: #e2e8f0; overflow: hidden; display: flex; }
  .bar-m-loss { background: #ef4444; }
  .bar-ok { background: #22c55e; }
  .bar-a-loss { background: #f97316; }

  .year-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
  .mini-month { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 10px; }
  .mini-month h4 { margin: 0 0 6px; font-size: 0.88rem; display: flex; justify-content: space-between; }
  .mini-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; text-align: center; font-size: 0.7rem; }
  .mini-day { padding: 4px 2px; border-radius: 4px; font-weight: 700; cursor: pointer; }

  /* Ricerca Circolari & Mensa */
  .search-box {
    width: 100%; padding: 11px 13px; border: 1px solid var(--border); border-radius: 12px;
    font-size: 0.94rem; margin-bottom: 10px; background: #fff;
  }
  .circ-item {
    background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; margin-bottom: 8px;
  }
  .circ-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 4px; font-size: 0.76rem; color: var(--muted); }
  .circ-title { font-weight: 800; font-size: 0.94rem; margin-bottom: 4px; }
  .circ-sum { font-size: 0.83rem; color: var(--muted); }
  .circ-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .circ-full {
    display: none; margin-top: 8px; padding: 10px; background: #f8fafc; border-radius: 8px;
    font-size: 0.8rem; white-space: pre-wrap; max-height: 260px; overflow-y: auto; border: 1px solid #e2e8f0;
  }
  .circ-full.open { display: block; }

  /* Bottom Navigation */
  .bottom-nav {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    background: rgba(255,255,255,0.96);
    backdrop-filter: blur(10px);
    border-top: 1px solid var(--border);
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
    z-index: 50;
  }
  .nav-btn {
    border: none; background: transparent; color: var(--muted);
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    font-size: 0.7rem; font-weight: 700; padding: 4px 2px; cursor: pointer;
  }
  .nav-btn span.ico { font-size: 1.2rem; }
  .nav-btn.active { color: var(--primary); }

  /* Modal */
  .modal-bg {
    position: fixed; inset: 0; background: rgba(15,23,42,0.55); display: none;
    align-items: center; justify-content: center; padding: 14px; z-index: 100;
  }
  .modal-bg.open { display: flex; }
  .modal {
    background: #fff; border-radius: 16px; max-width: 600px; width: 100%;
    max-height: 88vh; overflow-y: auto; padding: 18px;
  }
  .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .modal-head h3 { margin: 0; font-size: 1.08rem; }
  .close-btn { border: none; background: #f1f5f9; border-radius: 8px; padding: 6px 10px; font-weight: 800; cursor: pointer; }
  .form-row { margin-bottom: 10px; }
  .form-row label { display: block; font-size: 0.78rem; font-weight: 700; color: var(--muted); margin-bottom: 4px; }
  .form-row input, .form-row select, .form-row textarea { width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.88rem; }

  @media (max-width: 680px) {
    .metrics-row { grid-template-columns: repeat(2, 1fr); }
    .day-cell { min-height: 70px; padding: 4px; }
    .day-events { display: none; }
    .badge { font-size: 0.6rem; padding: 1px 4px; }
  }
</style>
</head>
<body>

<header class="app-header">
  <div class="head-row">
    <div class="head-title">
      <h1>🏫 Belvedere Quarati</h1>
      <small id="headSubtitle">Plesso Belvedere • 38° C.D. Napoli</small>
    </div>
    <div class="head-btns">
      <button class="icon-btn" id="btnSync" onclick="syncLatestCirculars()">🔄 Aggiorna</button>
      <button class="icon-btn" onclick="openInstallHelp()">📲 App</button>
      <button class="icon-btn wa" onclick="openShareModal()">💬 WhatsApp</button>
    </div>
  </div>
  <div class="kids-bar" id="kidsBar"></div>
</header>

<div id="syncBanner" style="display:none; max-width:1120px; margin:10px auto 0; padding:0 14px;"></div>
<main class="wrap" id="appMain"></main>

<nav class="bottom-nav">
  <button class="nav-btn active" onclick="switchTab('oggi', this)"><span class="ico">🏠</span>Oggi</button>
  <button class="nav-btn" onclick="switchTab('calendario', this)"><span class="ico">📅</span>Calendario</button>
  <button class="nav-btn" onclick="switchTab('mensa', this)"><span class="ico">🍽️</span>Mensa</button>
  <button class="nav-btn" onclick="switchTab('circolari', this)"><span class="ico">🔍</span>Circolari</button>
</nav>

<div id="modalBg" class="modal-bg" onclick="if(event.target===this) closeModal()">
  <div class="modal">
    <div class="modal-head">
      <h3 id="modalTitle">Dettaglio</h3>
      <button class="close-btn" onclick="closeModal()">✕</button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

l 38° CD di Napoli Ai sigg. Genitori Rappresentanti 88 C.D. \"G. QUARATI\" - NAPOLI . di Classe/ Sez", "excerpt": "e\n(_)\n\n38° CIRCOLO\n\n\"GIUSEPPE QUARATI”\nNAPOLI\n\nAi Sigg. Genitori degli alunni di scuola dell'Infanzia e Primaria del 38° CD di Napoli\nAi sigg. Genitori Rappresentanti\n\n88 C.D. \"G. QUARATI\" - NAPOLI . di Classe/ Sezione\nProt. 0008236 del 19/11/2026 (con preghiera di diffusione)\nIV (Uscita) Sito/Atti\n\nOGGETTO: INFORMATIVA sull'Indizione sciopero generale per l'intera giornata di\nvenerdì 20/11/2026 Personale Dirigente, docente, ATA ed educativo del Comparto e\nArea Istruzione e Ricerca\n\nIn riferimento all'azione di sciopero già comunicata con le note prot. n°7811 del\n09/11/2026 - n°7938 - 11/11/2026 - n°8009 del 12/11/2026 (regolarmente pubblicate sul\nsito istituzionale della scuola) indetto dalle seguenti 00.SS.: CONFEDERAZIONE CGIL, FLC\nCGIL e SAESE\n\nSi comunica che per la giornata di VENERDÌ 20/11/2026 non sarà possibile\ngarantire il regolare svolgimento delle attività. Si invitano dunque le famiglie, la\nmattina di VENERDÌ 20 NOVEMBRE 2026, a non lasciare i propri figli all'ingresso,\nsenza essersi prima accertati DELLA PRESENZA DEGLI INSEGNANTI/PERSONALE\nSCOLASTICO E DELLE MODALITA' IN CUI EVENTUALMENTE SARA'\nGARANTITO IL SERVIZIO SCOLASTICO.\n\nSI COMUNICA, INOLTRE, CHE VENERDÌ 20 NOVEMBRE TUTTI I DOCENTI E\n\nGLI ALUNNI DEL PLESSO QUARATI ACCEDERANNO AI LOCALI SCOLASTICI\nDALL'INGRESSO PRINCIPALE.\n\nCerti della Vs attiva e fattiva collaborazione si inviano distinti saluti\n\nDIREZIONE DIDATTICA 38° CIRCOLO “GIUSEPPE QUARATI”\nVIA F.P.ToSTI,9 80127 NAPOLI TEL.FAX 081/5603942 081/6134412", "url": "https://www.cd38napoli.edu.it/categoria/le-circolari/1287/informativa-sull-indizione-sciopero-generale-per-l-intera-giornata-di-venerdi-20-novembre-2026/", "methods": ["OCR_TESSERACT_IT"], "attachments": [{"name": "timbro_informativa_sull_indizione_sciopero_generale_per_l_intera_giornata_di_venerdi_20_novembre_2026_.pdf", "url": "https://www.cd38napoli.edu.it/public/files/art_1287/timbro_informativa_sull_indizione_sciopero_generale_per_l_intera_giornata_di_venerdi_20_novembre_2026_.pdf", "local_path": ""}]}, {"art_id": 1286, "date": "2026-11-17", "school_year": "2026-2027", "title": "Sospensione attivita' didattiche plesso belvedere primaria / falcone infanzia", "topic": "Calendario / Chiusure", "summary": "Via F.sco Paolo Tosti, 9 - 80127 Napoli - tel. 0816585186 10816134412 Fax/tel. 0815603942 38 C.D. \"G. QUARATI\" - NAPOLI Prot. 0008157 del 17/11/2026 IV (Uscita) Oggetto: SOSPENSIONE ATTIVITÀ DIDATTICHE PLESSO BELVEDERE…", "excerpt": "Ambito Scolastico N. 12\n380 Circolo Didattico \"Giuseppe Quarati\"\nVia F.sco Paolo Tosti, 9 - 80127 Napoli - tel. 0816585186 10816134412 Fax/tel. 0815603942\nemail: naee03800d@istruzione.it — pec: naee03800d@pec.istruzione.it sito web: www.cd38napoli.edu.it\nCOD. MECC. NAEE03800D - C.F. 80024020630 CODICE UFFICIO FATTURAZIONE ELETTRONICA: UFQRGW\n38 C.D. \"G. QUARATI\" - NAPOLI\nProt. 0008157 del 17/11/2026\nIV (Uscita)\nNapoli, 17 novembre 2026\nAi docenti\nAl personale ATA\nAlle famiglie\nAl SITO\nOggetto: SOSPENSIONE ATTIVITÀ DIDATTICHE PLESSO BELVEDERE\nPRIMARIA/FALCONE INFANZIA\nVista la nota del Comune di Napoli, assunta al prot. con 1104658/1, avente ad\noggetto \"Sgombero coatto in esecuzione dell'ordinanza n0177 del 03/10/2017,\ndell'alloggio facente parte del patrimonio indisponibile del Comune di Napoli sito\nin Napoli, quartiere Vomero, via Aniello Falcone n0260/B piano terra,\na servizio\ndella Scuola Primaria Statale NA 38 plesso Belvedere... ,\nSi comunica che martedì 24 novembre le attività del plesso Belvedere\nPrimaria/ Falcone Infanzia saranno sospese.\nI docenti e il personale ATA, secondo l'orario di servizio previsto per quella\ngiornata, saranno in servizio ai plessi Quarati, Morelli e Belvedere Infanzia.\nDistinti saluti.\nII Diri e e Scol stico\ntt.ssa\n1", "url": "https://www.cd38napoli.edu.it/categoria/le-circolari/1286/sospen ione Cobas\n//\ngenerale nazionale\nintera giornata\nIpotesi di scheda informativa ad uso delle istituzioni scolastiche e dell'Amministrazione al fine di assolvere agli obblighi di informazione previsti dall'Accordo \nsullo sciopero nel Comparto Istruzione e Ricerca del 2 dicembre 2020 (art. 3, co. 5, Accordo)\nIniziative di sciopero proclamate per l'intera giornata del 20 novembre 2026 da: USB P.I., Confederazione CGIL, con adesione di FLC CGIL, SISA, S.I.D.L., \nFederazione Gilda Unams, CLAP, Confederazione COBAS, Sial Cobas, con adesione di CUB Confederazione,  ADL Varese e CUB SUR, SGB, CIB Unicobas con \nadesione di Unicobas scuola&Università, SSB.\nRiferimenti identificativi dell'istituzione scolastica\nSCIOPERO 20 NOVEMBRE 2026\nNote\n\n--- [Pagina successiva] ---\n\nCUB Confederazione\n//\ngenerale nazionale\nintera giornata\nADL VARESE\n//\ngenerale nazionale\nintera giornata\nSGB\n0.02%\nnazionale\nintera giornata\nCIB UNICOBAS\n//\ngenerale nazionale\nintera giornata\nUNICOBAS SCUOLA&UNIVERSITA'\n0.14%\nnazionale\nintera giornata\nSSB - SINDACATO SOCIALE DI \nBASE\n//\nnazionale\nintera giornata\nCUB SUR\n29.00%\nnazionale\nintera giornata\nMotivazioni dello sciopero\nPER: chiedere l'inserimento in Legge di Bilancio di risorse necessarie per salari adeguati al costo della vita attraverso il rinnovo dei contratti a partire dal \n2028/30; la costituzione di un fondo perequativo per tutti i lavoratori della Conocìscenza; contrastare la precarietà favorendo un piano straordinario di \nassunzioni, rinnovo dei contratti dei settori privati della Conoscenza; aumentare il FFO delle Università, Aumentare i fondi per gli Enti di Ricerca; aumentare gli \norganici del personale AFAM e ripristino della mobilità in Afam affinchè torni ad essere  materia di cotrattazione nazionale; assunzione di tutti i DS presenti \nnelle graduatorie  ed eliminazione di ogni vincolo sulla mobi", "url": "https://www.cd38napoli.edu.it/categoria/le-circolari/1282/comparto-e-area-istruzione-e-ricerca-settore-scuola-azioni-di-sciopero-previste-per-l-intera-giornata-del-20-novembre-p-v-/", "methods": ["TESTO_NATIVO"], "attachments": [{"name": "scheda_informativa_sciopero_20_novembre_.pdf", "url": "https://www.cd38napoli.edu.it/public/files/art_1282/scheda_informativa_sciopero_20_novembre_.pdf", "local_path": "2026-2027\\2026-11-12_art1282_scheda_informativa_sciopero_20_novembre_.pdf"}, {"name": "avviso_di_sciopero_20_novembre_2026_per_uussrr_e_scuole_.pdf", "url": "https://www.cd38napoli.edu.it/public/files/art_1282/avviso_di_sciopero_20_novembre_2026_per_uussrr_e_scuole_.pdf", "local_path": "2026-2027\\2026-11-12_art1282_avviso_di_sciopero_20_novembre_2026_per_uussrr_e_scuole_.pdf"}, {"name": "timbro_body_2_.pdf", "url": "https://www.cd38napoli.edu.it/public/files/art_1282/timbro_body_2_.pdf", "local_path": "2026-2027\\2026-11-12_art1282_timbro_body_2_.pdf"}]}, {"art_id": 1281, "date": "2026-11-12", "school_year": "2026-2027", "title": "Sciopero nazionale della scuola del 20 novembre 2026 FGU GILDA   Comunicazione e richiesta di diffusione", "topic": "Assemblee / Scioperi", "summary": "GILDA FG U N AMS — GILDA UNAMS — DEGLI 20 NOVEMBRE 2026 SCIOPERO INTERA GIORNATA Personale docente, educativo e ATA MANIFESTAZIONE A ROMA Piazza SS. Apostoli • ore 10.00 NO Al TAGLI DEGLI ORGANICI Più personale e meno a…", "excerpt": "GILDA\nFG U N AMS\n— GILDA UNAMS —\nDEGLI\n20 NOVEMBRE 2026\nSCIOPERO\nINTERA GIORNATA\nPersonale docente, educativo e ATA\nMANIFESTAZIONE A ROMA\nPiazza SS. Apostoli • ore 10.00\nNO Al TAGLI DEGLI ORGANICI\nPiù personale e meno alunni\nper classe\nSTIPENDI ADEGUATI\nAumenti contro l'inflazione\ne recupero dell'anno 2013\nLIBERTÀ Dl INSEGNAMENTO\nRiconoscimento del lavoro\naggiuntivo e meno burocrazia\nRISORSE ALLA SCUOLA\nSTATALE\nInvestimenti pubblici, non tagli\na favore delle private\nSTABILIZZAZIONE DEI PRECARI\nOrganici adeguati alle reali\nesigenze delle scuole\nSICUREZZA E DIGNITÀ\nTutela dalle aggressioni, edifici sicuri\ne diritto alla disconnessione\nRESTITUIAMO DIGNITA ALLA\nSCUOLA STATALE\n\nDa: gildanapoli@gildanapoli.it\nOggetto: [Comunicazione Sindacale FGU NA] Sciopero nazionale della scuola del 20 novembre 2026\nFGU GILDA Comunicazione e richiesta di diffusione\nData: 07/11/2026 12:30:54\nAi Dirigenti scolastici\ndelle istituzioni scolastiche di ogni ordine e grado\ndi Napoli e provincia\nGentili Dirigenti,\nla Federazione Gilda-Unams ha indetto uno sciopero nazionale della scuola per venerdì 20 novembre 2026 , per ridare\ndignità alla scuola statale e valorizzare il lavoro del personale scolastico.\nLe principali rivendicazioni alla base della mobilitazione sono:\nstop ai tagli agli organici;\nstabilizzazione del personale precario;\nstipendi adeguati e recupero dell’anno 2013;\nriconoscimento del lavoro sommerso;\ntutela della libertà di insegnamento;\nscuole sicure e riduzione della burocrazia.\nIn occasione dello sciopero si terrà una manifestazione nazionale a Roma, in Piazza Santi Apostoli, alle ore 10:00 .\nSi chiede alle SS.LL. di voler assicurare la più ampia diffusione della presente comunicazione e della locandina allegata a tutto il\npersonale scolastico, attraverso i consueti canali istituzionali, e di curarne la pubblicazione all’albo sindacale.\nRingraziando per la collaborazione, si porgono cordiali saluti.\nGiuseppe Canonico\nCoordinatore Provinciale FGU NAPOLI", "url": "https://www.cd38napoli.edu.it/categoria/le-circolari/1281/sciopero-nazionale-della-scuola-del-20-novembre-2026-fgu-gilda-comunicazione-e-richiesta-di-diffusione/", "methods": ["OCR_WINDOWS_IT", "TESTO_NATIVO"], "attachments": [{"name": "sciopero_fgu_20_11_2026_.pdf", "url": "https://www.cd38napoli.edu.it/public/files/art_1281/sciopero_fgu_20_11_2026_.pdf", "local_path": "2026-2027\\2026-11-12_art1281_sciopero_fgu_20_11_2026_.pdf"}, {"name": "timbro_body_3_.pdf", "url": "https://www.cd38napoli.edu.it/public/files/art_1281/timbro_body_3_.pdf", "local_path": "2026-2027\\2026-11-12_art1281_timbro_body_3 LC CGIL Napoli, che di seguito si riporta: \n \nMERCOLEDÌ 11 NOVEMBRE INGRESSO ORE 11.00 \nPLESSO QUARATI \nCLASSI SECONDE: 2^B – 2^C – 2^G; \nCLASSI TERZE: 3^A – 3^E – 3^F; \nCLASSI QUARTE: 4^A – 4^B – 4^C – 4^D \nCLASSI QUINTE: 5^A – 5^F; \nPLESSO MORELLI \nCLASSE 1^B \nPLESSO BELVEDERE PRIMARIA \nCLASSI: 1^A – 3^A – 4^A – 5^A \nPLESSO BELVEDERE INFANZIA \nSEZIONI     A B C E \nPLESSO FALCONE \nSEZIONE A \nLe classi e sezioni non indicate nel prospetto su riportato, mercoledì 11 novembre entreranno \nregolarmente alle ore 08.10 (scuola Primaria) e alle ore 08.15 (scuola dell’Infanzia). \n \nDistinti saluti.                                                                                                  Il Dirigente Scolastico \n                                                                                                                        Dott. Marina Esposito", "url": "https://www.cd38napoli.edu.it/categoria/le-circolari/1278/revoca-assemblea-sindacale-snals-confsal-10-11-2026-ingresso-classi-11-11-2026/", "methods": ["TESTO_NATIVO"], "attachments": [{"name": "timbro_revoca_assemblea_sindacale_snals_confsal_10_11_26_e_ingresso_classi_11_11_2026_.pdf", "url": "https://www.cd38napoli.edu.it/public/files/art_1278/timbro_revoca_assemblea_sindacale_snals_confsal_10_11_26_e_ingresso_classi_11_11_2026_.pdf", "local_path": "2026-2027\\2026-11-09_art1278_timbro_revoca_assemblea_sindacale_snals_confsal_10_11_26_e_ingresso_classi_11_11_2026_.pdf"}]}, {"art_id": 1277, "date": "2026-11-06", "school_year": "2026-2027", "title": "Ingresso classi/sezioni martedì 10 e mercoledì 11 novembre 2026 - assemblee sindacali", "topic": "Assemblee / Scioperi", "summary": "Oggetto: INGRESSO CLASSI/SEZIONI MARTEDÌ 10 E MERCOLEDÌ 11 NOVEMBRE 2026 - ASSEMBLEE SINDACALI Viste le adesioni del personale ATA e docente alle Assemblee Sindacali indette da SNALS CONFSAL e FLC CGIL Napoli MARTEDÌ 10…", "excerpt": "Ambito Scolastico N. 12 \n38° Circolo Didattico “Giuseppe Quarati” \nVia Francesc intende informare codeste Municipalità \nsulle conseguenze dei recenti scioperi degli autotrasportatori che si stanno avvicendano negli ultimi \nperiodi. Gli attuali blocchi autostradali dovuti alle proteste stanno mettendo in seria difficoltà gli \napprovvigionamenti delle materie prime, la cui carenza si protrarrà per tutto il periodo legato agli \nscioperi. \nAttualmente si riscontra difficoltà di approvvigionamento per il pane integrale, la mela in IV \ngamma e le carote fresche, per cui, atteso quanto indicato, la scrivente vi informa che sarà costretta, \nsuo malgrado, ad apportare le seguenti variazioni al menu in vigore: \n- \nSomministrazione di pane tradizionale al posto del pane integrale\n\n--- [Pagina successiva] ---\n\n- \nSomministrazione di frutta fresca al posto della mela in IV gamma \n- \nSomministrazione di carote cotte, al posto delle carote julienne \nSi allegano a tal fine le dichiarazioni dei propri fornitori di riferimento in merito alla difficoltà \ndi approvvigionamento. \nConfidando nella vostra comprensione, si resta in attesa di un vs. cortese riscontro in merito. \n \n  Per Vivenda S.p.a. \nIl Direttore di Filiale \n       Donato Lopez\n\nDa: municipalita5.attivita.amministrative@comune.napoli.it\nOggetto: Trasmissione comunicazione Vivenda SPA\nData: 22/10/2026 11:54:18\nSi trasmette la nota pervenuta dalla ditta Vivenda Spa, nella quale comunica che, in merito alle conseguenze\ndei recenti scioperi degli autotrasportatori che si stanno verificando negli ultimi periodi, vista la difficoltà a\nreperire prodotti, sarà costretta a sostituire alcuni prodotti, limitatamente al periodo della permanenza dello\nstato di emergenza.\nCordiali saluti\nUnità Operativa Attività Scolastiche ed Educative.\nComune di Napoli - Municipalità 5 Vomero/Arenella\n0817950133-0817950113-0817950121\n\nDa: municipalita5.attivita.amministrative@comune.napoli.it\nOggetto: Comunicazione variazioni menù per le giornate del 22 e 23 ottobre\nData: 22/10/2026 11:05:24\nSi comuni", "url": "https://www.cd38napoli.edu.it/categoria/le-circolari/1273/comunicazione-variazioni-menu-per-le-giornate-del-22-e-23-ottobre/", "methods": ["TESTO_NATIVO"], "attachments": [{"name": "timbro_nota_difficolta_approvvigionamento_.pdf", "url": "https://www.cd38napoli.edu.it/public/files/art_1273/timbro_nota_difficolta_approvvigionamento_.pdf", "local_path": "2026-2027\\2026-10-22_art1273_timbro_nota_difficolta_approvvigionamento_.pdf"}, {"name": "trasmissione_comunicazione_vivenda_spa_.pdf", "url": "https://www.cd38napoli.edu.it/public/files/art_1273/trasmissione_comunicazione_vivenda_spa_.pdf", "local_path": "2026-2027\\2026-10-22_art1273_trasmissione_comunicazione_vivenda_spa_.pdf"}, {"name": "comunicazione_variazioni_menu_per_le_giornate_del_22_e_23_ottobre_.pdf", "url": "https://www.cd38napoli.edu.it/public/files/art_1273/comunicazione_variazioni_menu_per_le_giornate_del_22_e_23_ottobre_.pdf", "local_path": "2026-2027\\2026-10-22_art1273_comunicazione_variazioni_menu_per_le_giornate_del_22_e_23_ottobre_.pdf"}]}, {"art_id": 1272, "date": "2026-10-22", "school_year": "2026-2027", "title": "Sciopero genarale del 30 ottobre 2026", "topic": "Assemblee / Scioperi", "summary": "Unione Sindacale di Base UNIONE SINDACALE Dl BASE II pubblico impiego contro l'economia di guerra. 30 ottobre sciopero generale 30 OTTOBRE 2025 CONTRO IL RIARMO E IL CAROVITA Nazionale, 20/10/2026 II riarmo ha un costo…", "excerpt": "Unione Sindacale di Base\nUSB\nUNIONE SINDACALE Dl BASE\nII pubblico impiego contro l'economia di guerra. 30 ottobre\nsciopero generale\n30 OTTOBRE 2025\nCONTRO IL RIARMO E IL CAROVITA\nNazionale, 20/10/2026\nII riarmo ha un costo, e il conto lo stanno pagando i servizi pubblici, assieme a chi li fa\nfunzionare.\nOgni miliardo speso per le armi esce dalla stessa cassa da cui dovrebbero uscire salari\nadeguati all'aumento dell'inflazione che a sua volta è alimentata dalle guerre.\nA fare le spese di questo circolo vizioso sono le scuole, gli ospedali, l'intero tessuto dello\nstato sociale.\nLe retribuzioni di chi lavora nel pubblico impiego, solo con gli ultimi due contratti, hanno\nperso circa il 12% del proprio valore per via del logoramento del potere d'acquisto. Le\ndiseguaglianze si allargano, mentre il carovita ormai è la norma.\nL'Italia è ultima in Europa per retribuzioni nel pubblico impiego. Eppure, mentre lo stato\nsociale si svuota, ciò che ne resta viene piegato alle esigenze della macchina bellica.\nNon è una deriva. È un cambio di modello: meno cura, più caserme.\nPer rimettere in piedi uno stato sociale adeguato ai bisogni del Paese servirebbero un\nmilione di assunzioni, come delineato da uno studio accademico e come dichiarato dallo\nstesso ministro Zangrillo.\n\nUnione Sindacale di Base \n00175 Roma, Via dell’Aeroporto, 129 -  Tel. 0659640004  \n e-mail: usb@usb.it, pec: usbnazionale@pec.usb.it  \nweb: http://www.usb.it \n1 \n                                                                                                                                                      \n                  Presidente del Consiglio  \nGiorgia Meloni \nPalazzo Chigi  \nPiazza Colonna, 370 \nRoma, 06 ottobre 2026                                                                    00186 Roma \nusg@mailbox.governo.it \n \nMinistro del Lavoro e delle Politiche Sociali \nMarina Elvira Calderone \nVia Fornovo,8 \n00182 Roma \nsegreteriaministro@pec.lavoro.gov.it  \n \nMinistro per la Funzione Pubblica \nPaolo Zangrillo \nCorso Vittorio Emanuele II, 116 \n00186 Roma \nPresidenza del Consiglio dei Ministri \nDipartimento Funzione Pubblica \nprotocollo_dfp@mailbox.governo.it \n \nCommissione di Garanzia Legge 146/90 \nPiazza del Gesù, 46 \n00186 Roma \nsegreteria@pec.commissionegaranziasciopero.it \n \nMinistero dei Trasporti \nOsservatorio Scioperi Trasporti \n \n \n \n \n \n \n                              osservat.sindacale@mit.gov.it  \n \n \nProt.N/261006/032 \n \nOggetto: Proclamazione Sciopero Generale per l’in o nei \nmenù della refezione scolastica.\nFacendo seguito alle indicazioni pervenute dal Dipartimento di Prevenzione U.O.S.D. \nPromozione della Salute e Sorveglianza si riportano le seguenti prescrizioni: \n- la preparazione della pasta tricolore è sostituita con Pasta al pomodoro e Fior di latte;\n- il riso all'insalata deve essere preparato e servito senza pomodorini, in quanto l'apporto \ngiornaliero di fibra è garantito dal contorno;\n- il gelato — previsto nella quarta settimana del menù estivo — può essere sostituito con budino \nal cioccolato o altro dolcetto.\nSi resta a disposizione per eventuali ulteriori chiarimenti.\nLa Responsabile del procedimento\nTitolare EQ Stefania Annibale\nstefania.annibale@comune.napoli.it\n081-7959406\n   La Dirigente \n   \n                          Valeria De Lisa\nLa firma, in formato digitale, è stata apposta sull'originale del presente documento ai sensi dell'art.24 del D. Lgs.82/2005 e s.m.i. (CAD). Il presente \ndocumento è conservato in originale negli archivi informatici del Comune di Napoli, ai sensi dell'art. 22 del D.Lgs.82/2005.\nValeria De\nLisa\n15.10.2026\n14:42:30\nGMT+02:00", "url": "https://www.cd38napoli.edu.it/categoria/le-circolari/1271/chiarimenti-in-merito-alla-sostituzione-del-pomodoro-fresco-e-del-gelato-nel-menu-della-refezione-scolastica/", "methods": ["TESTO_NATIVO"], "attachments": [{"name": "timbro_u_1108580_circolare_pomodori_gelato_signed_.pdf", "url": "https://www.cd38napoli.edu.it/public/files/art_1271/timbro_u_1108580_circolare_pomodori_gelato_signed_.pdf", "local_path": "2026-2027\\2026-10-16_art1271_timbro_u_1108580_circolare_pomodori_gelato_signed_.pdf"}]}, {"art_id": 1270, "date": "2026-10-12", "school_year": "2026-2027", "title": "Comparto e Area Istruzione e Ricerca settore Scuola azioni di sciopero per l'intera giornata del 16 ottobre p.v.", "topic": "Assemblee / Scioperi", "summary": "Proclamante % Rappresentatività a livello nazionale (1) % voti nella scuola per le elezioni RSU Tipo one del 2,5% per ciascun anno \nmancante rispetto ai quaranta anni di servizio , i quali abbiano almeno trent'anni di servizio e di contributi senza vincoli di età anagrafica; impegno per l'ambiente e il clima insieme al \nmovimento giovanile internazionale\".\nIpotesi di scheda informativa ad uso delle istituzioni scolastiche e dell'Amministrazione al fine di assolvere agli obblighi di informazione previsti dall'Accordo sullo sciopero nel Comparto \nIstruzione e Ricerca del 2 dicembre 2020 (art. 3, co. 5, Accordo)\nSISA - Sindacato Indipendente Scuola e Ambiente.                                                                                                                         \nRiferiment", "url": "https://www.cd38napoli.edu.it/categoria/le-circolari/1270/comparto-e-area-istruzione-e-ricerca-settore-scuola-azioni-di-sciopero-per-l-intera-giornata-del-16-ottobre-p-v-/", "methods": ["TESTO_NATIVO"], "attachments": [{"name": "scheda_informativa_16_ottobre_.pdf", "url": "https://www.cd38napoli.edu.it/public/files/art_1270/scheda_informativa_16_ottobre_.pdf", "local_path": "2026-2027\\2026-10-12_art1270_scheda_informativa_16_ottobre_.pdf"}, {"name": "avviso_di_sciopero_16_ottobre_2026_per-uussrr_.pdf", "url": "https://www.cd38napoli.edu.it/public/files/art_1270/avviso_di_sciopero_16_ottobre_2026_per-uussrr_.pdf", "local_path": "2026-2027\\2026-10-12_art1270_avviso_di_sciopero_16_ottobre_2026_per-uussrr_.pdf"}, {"name": "comparto_e_area_istruzione_e_ricerca_settore_scuola_azioni_di_sciopero_per_l_intera_giornata_del_16_ottobre_p_v_.pdf", "url": "https://www.cd38napoli.edu.it/public/files/art_1270/comparto_e_area_istruzione_e_ricerca_settore_scuola_azioni_di_sciopero_per_l_intera_giornata_del_16_ottobre_p_v_.pdf", "local_path": "2026-2027\\2026-10-12_art1270_comparto_e_area_istruzione_e_ricerca_settore_scuola_azioni_di_sciopero_per_l_intera_giornata_del_16_ottobre_p_v_.pdf"}]}, {"art_id": 1269, "date": "2026-10-09", "school_year": "2026-2027", "title": "Variazione menu per il giorno 12 ottobre 2026", "topic": "Refezione / Mensa", "summary": "Spett.le Comune di Napoli Municipalità II Attività Amministrative municipalita2@pec.comune.napoli.it Municipalità V Attività Amministrative municipalità5@pec.comune.napoli.it Oggetto: comunicazione variazione dei piatti…", "excerpt": "Napoli, 08/10/2026. \nSpett.le  \nComune di Napoli \n \nMunicipalità II \nAttività Amministrative \nmunicipalita2@pec.comune.napoli.it                             \n \nMunicipalità V \nAttività Amministrative \nmunicipalità5@pec.comune.napoli.it \n \n \nOggetto: comunicazione variazione dei piatti previsti da menu nella giornata di oggi Giovedi \n08/10/2026 e Lunedi 12/10/2026 – sospensione “pomodori freschi”. \n \nIn ottemperanza alla recente disposizione emanata degli organi competenti circa la \nsospensione dell’utilizzo e somministrazione del pomodoro fresco, la scrivente società Vi informa \nsulle prossime variazioni apportate al menu in vigore: \nGiovedi 08/10/2026: la portata prevista per la giornata odierna prevederà la somministrazione \ndi “patate e fagiolini” con l’esclusione, pertanto, del pomodoro fresco per tutte le scuole del Lotto II \ne V, eccezion fatta per il servizio in favore dei nidi che prevederà la somministrazione di “spinaci” al \nposto dei “pomodorini”. \nLunedi 12/10/2026: la potata “pomodori ad insalata” sarà sostituita da “carote julienne” per \ntutte le scuole, eccezion fatta per il servizio in favore dei nidi che prevederà la somministrazione di \n“spinaci” al posto di “pomodori”. \nCordiali saluti.  \nVivenda S.p.A. \nIl Direttore di Filiale \nDonato Lopez", "url": "https://www.cd38napoli.edu.it/categoria/le-circolari/1269/variazione-menu-per-il-giorno-12-ottobre-2026/", "methods": ["TESTO_NATIVO"], "attachments": [{"name": "timbro_comunicazione_variazione_menu_08_10_e_12_10_.pdf", "url": "https://www.cd38napoli.edu.it/public/files/art_1269/timbro_comunicazione_variazione_menu_08_10_e_12_10_.pdf", "local_path": "2026-2027\\2026-10-09_art1269_timbro_comunicazione_variazione_menu_08_10_e_12_10_.pdf"}]}, {"art_id": 1268, "date": "2026-10-07", "school_year": "2026-2027", "title": "Ingresso Classi/sezioni Lunedì 12 ottobre assemblea sindacale", "topic": "Assemblee / Scioperi", "summary": "38 C.D. \"G. QUARATI\" - NAPOLI Prot. 0006731 del 07/10/2026 IV (Uscita) A1 SITO Oggetto: INGRESSO CLASSI/SEZIONI LUNEDÌ 12 OTTOBRE 2026 - ASSEMBLEA SINDACALE Viste le adesioni del personale ATA e docente all'Assemblea Si…", "excerpt": "Ambito Scolastico N. 12\n380 Circolo Didattico \"Giuseppe Quarati\"\nVia Francesco Paolo Tosti, 9 - 80127 Napoli - tel. 0816585186 10816134412\nFax/tel. 0815603942\nE-Mail: naee03800d@istruzione.qov.it — PEC: naee03800d@pec.istruzione.it\nSito web: www.cd38napoli.edu.it\nCOD. MECC. NAEE03800D - C.F. 80024020630\nCODICE UFFICIO FATTURAZIONE ELETTRONICA: UFQRGW\n38 C.D. \"G. QUARATI\" - NAPOLI\nProt. 0006731 del 07/10/2026\nIV (Uscita)\nC.F. 80024020630\nNapoli, 07 ottobre 2026\nAi docenti\nAl personale ATA\nAlle famiglie\nA1 SITO\nOggetto: INGRESSO CLASSI/SEZIONI LUNEDÌ 12 OTTOBRE 2026 - ASSEMBLEA SINDACALE\nViste le adesioni del personale ATA e docente all'Assemblea Sindacale indetta da FLC — CGIL Napoli,\nLUNEDÌ 12 OTTOBRE dalle ore 08.00 alle ore 11.00, si comunica che tutte le classi di scuoia Primaria e\ntutte le sezioni di scuola dell'Infanzia entreranno alle ore 1 1.00.\nDistinti saluti.\n11 Di\nott.ssa\nte Scola tico\ns", "url": "https://www.cd38napoli.edu.it/categoria/le-circolari/1268/ingresso-classi-sezioni-lunedi-12-ottobre-assemblea-sindacale/", "methods": ["OCR_WINDOWS_IT"], "attachments": [{"name": "timbro_ingresso_classi_sezioni_lunedi_12_ottobre_assemblea_sindacale_.pdf", "url": "https://www.cd38napoli.edu.it/public/files/art_1268/timbro_ingresso_classi_sezioni_lunedi_12_ottobre_assemblea_sindacale_.pdf", "local_path": "2026-2027\\2026-10-07_art1268_timbro_ingresso_classi_sezioni_lunedi_12_ottobre_assemblea_sindacale_.pdf"}]}, {"art_id": 1267, "date": "2026-10-06", "school_year": "2026-2027", "title": "Comunicazione refezione scolastica del giorno 06/10/2026", "topic": "Refezione / Mensa", "summary": "Da: municipalita5.attivita.amministrative@comune.napoli.it Oggetto: Comunicazione refezione scolastica del giorno 06/10/2026 Data: 06/10/2026 10:16:53 Con la presente si porta a conoscenza che la ditta fornitrice del se…", "excerpt": "Da: municipalita5.attivita.amministrative@comune.napoli.it\nOggetto: Comunicazione refezione scolastica del giorno 06/10/2026\nData: 06/10/2026 10:16:53\nCon la presente si porta a conoscenza che la ditta fornitrice del servizio di refezione scolastica ha stamane\ninformalmente comunicato che, a seguito di segnalazione dell'ASL, è necessario sospendere in via\ncautelativa l'utilizzo del pomodoro crudo nel menù. Tenuto conto del lasso ridotto di tempo dalla ricezione\ndella direttiva e quindi dell'impossibilità di reperire un alimento fresco da servire in sostituzione del\npomodoro, si rappresenta che, limitatamente alla giornata di oggi, il menù sarà servito senza il contorno.\nCordiali saluti\nUnità Operativa Attività Scolastiche ed Educative.\nComune di Napoli - Municipalità 5 Vomero/Arenella\n0817950133-0817950113-0817950121", "url": "https://www.cd38napoli.edu.it/categoria/le-circolari/1267/comunicazione-refezione-scolastica-del-giorno-06-10-2026/", "methods": ["TESTO_NATIVO"], "attachments": [{"name": "comunicazione_refezione_scolastica_del_giorno_06102026_.pdf", "url": "https://www.cd38napoli.edu.it/public/files/art_1267/comunicazione_refezione_scolastica_del_giorno_06102026_.pdf", "local_path": "2026-2027\\2026-10-06_art1267_comunicazione_refezione_scolastica_del_giorno_06102026_.pdf"}]}, {"art_id": 1266, "date": "2026-10-02", "school_year": "2026-2027", "title": "Avviso del servizio di refezione scolastica - modalita' di erogazione dei pasti", "topic": "Refezione / Mensa", "summary": "Via F.sco Paolo Tosti, 9 - 80127 Napoli - tel. 081658518610816134412 Fax/tel. 0815603942 38 C.D. \"G. QUARATI\" - NAPOLI Prot. 0006545 del 02/10/2026 V-6 (Uscita) Al personale docente e ATA Ai Responsabili di plesso Alle…", "excerpt": "Ambito Scolastico N. 12\n380 Circolo Didattico \"Giuseppe Quarati\"\nVia F.sco Paolo Tosti, 9 - 80127 Napoli - tel. 081658518610816134412 Fax/tel. 0815603942\nemail: naee03800d@istruzione.it — pec: naee03800d@pec.istruzione.it sito web: www.cd38napoli.edu.it\nCOD. MECC. NAEE03800D - C.F. 80024020630 CODICE UFFICIO FATTURAZIONE ELETTRONICA: UFQRGW\n38 C.D. \"G. QUARATI\" - NAPOLI\nProt. 0006545 del 02/10/2026\nV-6 (Uscita)\nAl personale docente e ATA\nAi Responsabili di plesso\nAlle famiglie degli alunni\nAl Comune/Ente gestore del servizio di refezione\nAl sito web dell'Istituto\nOggetto: Avvio del servizio di refezione scolastica — modalità di erogazione dei\npasti\nSi comunica alle famiglie e a tutto il personale scolastico che il servizio di refezione\nscolastica presso i plessi Morelli, Belvedere/Falcone sarà avviato il 05/10/2026 mediante\nla distribuzione di pasti monoporzionati, nelle more del completamento dei lavori di\nadeguamento dei locali destinati allo scodellamento e alla distribuzione dei pasti.\nI lavori presso i suddetti plessi dovrebbero essere ultimati nel corso della prossima\nsettimana.\nPertanto, dal 05/10 al 09/10 , il servizio di refezione sarà organizzato mediante la\nfornitura e distribuzione di pasti confezionati in monoporzione, secondo le modalità\npreviste dal gestore del servizio e nel rispetto delle vigenti disposizioni in materia di\nsicurezza e igiene alimentare.\nDal 12/10/2026, terminati i lavori e ripristinate le condizioni necessarie per l'utilizzo\ndei locali destinati allo scodellamento, il servizio tornerà a essere effettuato secondo le\nmodalità ordinarie.\nSi comunica, inoltre, che presso il plesso Belvedere Infanzia il servizio di refezione sarà\neffettuato mediante pasti monoporzionati per l'intera durata dell'anno scolastico,\nsecondo l'organizzazione prevista dal servizio di refezione, non avendo l'ufficio tecnico\nafferente alla V Municipalità individuato un locale idoneo allo scodellamento. Per la sede\nQuarati il servizio di refezione partirà con lo scodellamento fin dal 05 ottobre.\nSi invitano le famiglie e il personale a prendere visione della presente comunicazione e\na collaborare affinché il servizio possa svolgersi con regolarità, nel rispetto delle\nmodalità organizzative adottate.\nEventuali ulteriori comunicazioni relative all'organizzazione del servizio saranno\ntempestivamente rese note attraverso i consueti canali istituzionali.\nSi ringrazia per la consueta collaborazione e si inviano distinti saluti.\n11 Di i\nSc Iastico\nsito", "url": "https://www.cd38napoli.edu.it/categoria/le-circolari/1266/avviso-del-servizio-di-refezione-scolastica-modalita-di-erogazione-dei-pasti/", "methods": ["OCR_WINDOWS_IT"], "attachments": [{"name": "timbro_avviso_del_servizio_di_refezione_scolastica_-_modalita_di_erogazione_dei_pasti_.pdf", "url": "https://www.cd38napoli.edu.it/public/files/art_1266/timbro_avviso_del_servizio_di_refezione_scolastica_-_modalita_di_erogazione_dei_pasti_.pdf", "local_path": "2026-2027\\2026-10-02_art1266_timbro_avviso_del_servizio_di_refezione_scolastica_-_modalita_di_erogazione_dei_pasti_.pdf"}]}, {"art_id": 1265, "date": "2026-09-30", "school_year": "2026-2027", "title": "Entrata in vigore orario definitivo dal 05/10/2026", "topic": "Orari / Ingressi / Avvio", "summary": "G. Quarati 38 C.D. \"G. QUARATI\" - NAPOLI Prot. 0006477 del 30/09/2026 IV (Uscita) 380 CIRCOLO \"GIUSEPPE QUARATI\" NAPOLI Al portale ARGO OGGETTO: ENTRATA IN VIGORE ORARIO DEFINITIVO Con la presente si comunica che lunedì…", "excerpt": "G. Quarati\n38 C.D. \"G. QUARATI\" - NAPOLI\nProt. 0006477 del 30/09/2026\nIV (Uscita)\nDIREZIONE DIDATTICA\n380 CIRCOLO\n\"GIUSEPPE QUARATI\"\nNAPOLI\nAi docenti\nAl personale ATA\nAlle Famiglie\nAl Sito\nAl portale ARGO\nOGGETTO: ENTRATA IN VIGORE ORARIO DEFINITIVO\nCon la presente si comunica che lunedì 05 ottobre 2026 entrerà in vigore l'orario definitivo con\nl'avvio del servizio di refezione.\nLe classi di scuola Primaria usciranno secondo la seguente organizzazione:\nCLASSI A TEMPO PIENO\nCLASSI PRIME: ingresso ore 08.10 uscita ore 16.00\nCLASSI SECONDE: ingresso ore 08.10 uscita ore 16.05\nCLASSI TERZE/QUARTE/QUINTE: ingresso ore 08.10 uscita ore 16.10.\nCLASSI A TEMPO NORMALE\nDAL LUNEDÌ AL GIOVEDÌ\nCLASSI PRIME: ingresso ore 08.10 uscita ore 13.30\nCLASSI SECONDE: ingresso ore 08.10 uscita ore 13.35\nCLASSI TERZE: ingresso ore 08.10 uscita ore 13.40\nCLASSI QUARTE/QUINTE: ingresso ore 08.10 uscita 14.10\nVENERDÌ\nCLASSI PRIME: ingresso ore 08.10 uscita ore 13.00\nCLASSI SECONDE: ingresso ore 08.10 uscita ore 13.05\nCLASSI TERZE/ QUARTE/QUINTE: ingresso ore 08. I O uscita ore 13.10\nLe sezioni di scuola dell'Infanzia svolgeranno le attività didattiche dalle ore 08.15 alle 16.15\nSi comunica, inoltre, che giovedì 01 ottobre 2026 saranno trasmessi gli orari definitivi ai docenti e\nal personale ATA.\nDistinti saluti.\nDIREZIONE DIDATTICA 380 C\nCO NEO/\nDIRIGE T SCOL TICO\nott.ssa M\n\"GIUSEPPE QUARA 1\"\nVIA F.P.TosTl,9 80127 NAPOLI TEL. FAX 081/5603942 081/6134412", "url": "https://www.cd38napoli.edu.it/categoria/le-circolari/1265/entrata-in-vigore-orario-definitivo-dal-05-10-2026/", "methods": ["OCR_WINDOWS_IT"], "attachments": [{"name": "timbro_avvio_orario_definitivo-1_.pdf", "url": "https://www.cd38napoli.edu.it/public/files/art_1265/timbro_avvio_orario_definitivo-1_.pdf", "local_path": "2026-2027\\2026-09-30_art1265_timbro_avvio_orario_definitivo-1_.pdf"}]}, {"art_id": 1264, "date": "2026-09-24", "school_year": "2026-2027", "title": "Comparto e Area Istruzione e Ricerca_ settore Scuola_ Sciopero plurisettoriale del 2 ottobre 2026", "topic": "Assemblee / Scioperi", "summary": "Proclamante % Rappresentatività a livello nazionale (1) % voti nella scuola per le elezioni RSU Tipo di sciopero Durata dello sciopero CSLE plurisettoriale Intera giornata FI-SI plurisettoriale ASSI\n12\n14\n16\nCLASSI\nABBINATE\nORARIO\nVA\nVB\nVA\n17\n20\n15\n9,45\n- 10,15\nSPAZIO\nVIA SCARLATTI\nANGOLO VIA\nMERLIANI\nVIA SCARLATTI\nANGOLO VIA\nMERLIANI\nVIA SCARLATTI\nANGOLO VIA\nMERLIANI\nSPAZIO ALTERNATIVO\nIN CASO Dl PIOGGIA\nLOCALI\nALL'INTERNO DEL\nPLESSO MORELLI\nLOCALI\nALL'INTERNO DEL\nPLESSO MORELLI\nLOCALI\nALL'INTERNO DEL\nPLESSO BELVEDERE\nGli alunni di classe prima dei Plesso Morelli e Belvedere accompagnati dai genitori, si recheranno in via\nScarlatti angolo via Merliani, dove troveranno i docenti e gli animatori ad accoglierli.\nGli alunni di tutti i plessi, al termine dell'accoglienza, si recheranno nelle rispettive classi accompagnati dalle\ndocenti; per il Plesso Quarati i genitori torneranno per prelevare i bambini secondo il regolare orario di\nuscita alle ore 13,00; per i Plessi Morelli e Belvedere i genitori potranno accompagnare i propri figli, insieme\nalle insegnanti, fino al portone esterno del proprio plesso.\nDal lunedì successivo per tutte le classi prime nei plessi di appartenenza, l'orario sarà il seguente: 8,10 — 13,00.\nACCOGLIENZA SCUOLA DELL'INFANZIA\n• Plesso Belvedere Infanzia e Plesso Falcone\nVenerdì 18 settembre 2026\nPeri 3 anni\nGli alunni saranno divisi in 2 gruppi *\n10 gruppo entrata ore: 9.00 Uscita ore 10:30\n20 gruppo entrata ore: 11:00 Uscita 12:30\n\n--- [Pagina successiva] ---\n\nDa Lunedi 21 al 29 settembre 2026\n10 gruppo entrata dalle 8:15/9:00 Uscita 10:30\n20 gruppo entrata ore 11:00 Uscita 12:30/13:15\nDal 24/09/2026 i due gruppi invertiranno l'orario\nDal giorno 3", "url": "https://www.cd38napoli.edu.it/categoria/le-circolari/1261/ingresso-accoglienza-classi-prime-e-tre-anni-scuola-dell-infanzia/", "methods": ["OCR_WINDOWS_IT"], "attachments": [{"name": "timbro_ingresso_accoglienza_classi_prime_e_scuola_dell_infanzia_.pdf", "url": "https://www.cd38napoli.edu.it/public/files/art_1261/timbro_ingresso_accoglienza_classi_prime_e_scuola_dell_infanzia_.pdf", "local_path": "2026-2027\\2026-09-14_art126 state III edizione l'assemblea si svolgerà\nalle ore 16.30 (on line).\nMartedì 15 settembre 2026 incontro del DS con i genitori classi prime Plesso\nBelvedere ore 09.30 (sede Belvedere);\nMartedì 15 settembre 2025 incontro del DS con i genitori classi prime Plesso Morelli\nore 11.00 (sede Morelli);\nMercoledì 16 settembre 2025 incontro del DS con i genitori classi prime Sede\nQuarati:\nOre 09.30 classi prime a tempo normale;\nOre 11.00 classi prime a tempo pieno;\nDIREZIONE DIDATTICA 380 CIRCOLO \"GIUSEPPE QUARATI\"\nVIA F.P.TOSTl,9 80127 NAPOLI TEL. FAX 081/5603942 081/6134412\n\n--- [Pagina successiva] ---\n\nSCUOLA DELL'INFANZIA PLESSI BELVEDERE E FALCONE\nLunedì 14 settembre 2026\nAlunni 5 anni vecchi iscritti dalle ore 09.00 a", "url": "https://www.cd38napoli.edu.it/categoria/le-circolari/1258/avvio-lezioni-e-riunioni-inizio-anno-scolastico-2026-2027/", "methods": ["OCR_WINDOWS_IT"], "attachments": [{"name": "timbro_avvio_lezioni_e_riunioni_inizio_anno_scolastico_2026-2027_1_.pdf", "url": "https://www.cd38napoli.edu.it/public/files/art_1258/timbro_avvio_lezioni_e_riunioni_inizio_anno_scolastico_2026-2027_1_.pdf", "local_path": "2026-2027\\2026-09-04_art1258_timbro_avvio_lezioni_e_riunioni_inizio_anno_scolastico_2026-2027_1_.pdf"}]}, {"art_id": 1257, "date": "2026-08-27", "school_year": "2026-2027", "title": "Servizio Refezione Scolastica – A.S. 2026/2027 – Comunicazione nuova modalità adesione al servizio di refezione scolastica erogato presso le scuole dell'infanzia comunali, delle scuole primarie e secondarie di I° grado", "topic": "Refezione / Mensa", "summary": "Assessorato all'Istruzione e alle Famiglie Area Educazione Servizio Diritto allo Studio Direttori delle 10 Municipalità Dirigenti Scolastici delle Scuole primarie e secondarie di I° grado della Città di Napoli Oggetto…", "excerpt": "Assessorato all'Istruzione e alle Famiglie \nArea Educazione\nServizio Diritto allo Studio   \nPG/2026/843944 \ndel 05/08/2026\nAi\nDirettori delle 10 Municipalità\nAi\nDirigenti Scolastici delle Scuole primarie e \nsecondarie di I° grado della Città di Napoli\nOggetto: Servizio Refezione Scolastica – A.S. 2026/2027 – comunicazione nuova\nmodalità adesione al servizio di refezione scolastica erogato presso le scuole\ndell’infanzia comunali, delle scuole primarie e secondarie di I° grado.\nGentilissimi,\ncon la presente si comunica che, a partire dall’anno scolastico 2026/2027, il Comune di\nNapoli ha apportato alcune modifiche alla piattaforma di iscrizione al servizio di refezione\nscolastica SIMEAL come di seguito descritte.\nAdesione al servizio di refezione scolastica\nGli alunni dovranno, come di consueto, essere iscritti al servizio di refezione scolastica\nesclusivamente tramite piattaforma SIMEAL\nhttps://refezione.comune.napoli.it/portalecittadino/login\nRispetto agli scorsi anni, già in sede di iscrizione, ciascun utente dovrà indicare quale regime\ndietetico dovrà seguire il proprio figlio e, dunque, adottare la:\n1. dieta ordinaria per gli alunni che non hanno alcuna esigenza particolare; \nNel caso in cui l’alunno non abbia esigenze alimentari e/o etico-religiosi, fruirà\nautomaticamente della dieta ordinaria. \n2. diete standardizzate tipizzate per alunni affetti da patologie e/o intolleranze\nalimentari o per motivi religiosi/culturali  \nNel caso siano necessarie diete standardizzate per alunni affetti da patologie e/o\nintolleranze alimentari, dovrà essere richiesta la dieta da somministrare avendo cura di\nscaricare e compilare esclusivamente i moduli presenti in piattaforma SIMEAL.\nNel caso in cui si scelga una dieta per motivi religiosi/culturali, sarà sufficiente indicare\nla dieta scelta senza allegare alcuna documentazione.\n3. dieta personalizzata per gli alunni non rientranti nelle categorie sopra descritte. Nel\ncaso in cui l’alunno necessiti di dieta personalizzata, in sede di iscrizione dovrà essere\nrichiesta avendo cura di scaricare e compilare esclusivamente il modulo presenti in\npiattaforma SIMEAL.\nCiascun utente potrà scegliere solo una dieta.\nNel corso dell’anno sarà possibile variare la dieta per sopravvenute esigenze dell’alunno.\nDelle variazioni sarà tenuta traccia del database della piattaforma SIMEAL.\n                     Piazza Cavour, 42 80137 Napoli · tel. 081/7959409 -06\n                     Email : diritto.istruzione@comune.napoli.it – PEC : diri", "url": "https://www.cd38napoli.edu.it/categoria/le-circolari/1257/servizio-refezione-scolastica-a-s-2026-2027-comunicazione-nuova-modalita-adesione-al-servizio-di-refezione-scolastica-erogato-presso-le-scuole-dell-infanzia-comunali-delle-scuole-primarie-e-secondarie-di-i-grado/", "methods": ["TESTO_NATIVO"], "attachments": [{"name": "timbro_servizio_refezione_scolastica_a_s_26-27_comunicazione_nuova_modalita_adesione_al_servizio_di_refezione_scolastica-sign-signed_.pdf", "url": "https://www.cd38napoli.edu.it/public/files/art_1257/timbro_servizio_refezione_scolastica_a_s_26-27_comunicazione_nuova_modalita_adesione_al_servizio_di_refezione_scolastica-sign-signed_.pdf", "local_path": "2026-2027\\2026-08-27_art1257_timbro_servizio_refezione_scolastica_a_s_26-27_comunicazione_nuova_modalita_adesione_al_servizio_di_refezione_scolastica-s.pdf"}]}, {"art_id": 1256, "date": "2026-08-18", "school_year": "2026-2027", "title": "Cedole librarie e Librerie Accreditate per gli alunni residenti a Napoli e frequentanti le Scuole Primarie Campane  A. S. 2026/2027", "topic": "Iscrizioni / Libri / Servizi", "summary": "Elenco librerie e cartolibrerie accreditate per le scuole primarie A.S. 2026/2027 DENOMINAZIONE PUNTO VENDITA CITTA' TIPO CEDOLE 1) VIA S. GIACOMO DEI CAPRI, 58/c 2) VIA KERBAKER, 33-35 3) VIA A. D'ANTONA, 4 CARTOLIBRER…", "excerpt": "Elenco librerie e cartolibrerie accreditate per le scuole primarie A.S. 2026/2027\nDENOMINAZIONE\nPUNTO VENDITA\nCITTA'\nTIPO \nCEDOLE\n1) VIA S. GIACOMO DEI CAPRI, 58/c \n2) VIA KERBAKER, 33-35\n3) VIA A. D'ANTONA, 4\n2\nCARTOLIBRERIA COSTIGLIOLA DI COSTIGLIOLA CLAUDIA & sentatività nel Comparto Istruzione e \nRicerca  - Fonte: ARAN\n(2) Fonte: Dati di adesione nel Comparto Istruzione \ne Ricerca - Settore Istituzioni scolastiche - Fonte: \nMinistero dell'istruzione e del merito\nMotivazioni dello sciopero \nCONTRO la rifrma degli Istituti tecnici (DM29/2026), le misure introdotte dal Governo  volte a limitare i pensatissimi tagli agli organici, senza alcuna messa in discussione dell’impostazione \npedagogica sottesa al taglio delle discipline, la logica della scuola-azienda espressa in questi ultimi anni, contro l’ex pcto e la riforma della filiera tecnologico-professionale del 4+2; PER la \nnecessità di una mobilitazione compatta di tutte le scuole secondarie di secondo grado contro le indicazioni nazionali dei licei e progetti di riduzione dei percorsi di studio superiori a \nquattro anni \nIpotesi di scheda informativa ad uso delle istituzioni scolastiche e dell'Amministrazione al fine di assolvere agli obblighi di informazione previsti dall'Accordo sullo sciopero nel Comparto \nIstruzione e Ricerca del 2 dicembre 2020 (art. 3, co. 5, Accordo)\nUSB P.I. e Scuola\nRiferimenti identificativi dell'istituzione scolastica\nSciopero breve degli scrutini (comprese le attività di scrutinio finale, esclusi quelli propedeutici allo svolgimento degli esami conclusivi dei cicli di istruzione) di tutto il personale \ndocente in servizio presso le scuole secondarie di secondo grado, per la durata così come predeterminata in fase di programmazione dai piani delle attività di ogni singola istituzione \nscolastica, con data a partire, secondo l'articolazione regionale prevista ad oggi dalle singole regioni:\n6 giugno: Campania, Emilia-Romagna, Marche, Veneto;\n8 giugno: Calabria, Lazio, Lombardia, Sardegna;\n9 giugno: Abruzzo, Friuli-Venezia Giulia, Molise, Puglia, Sicilia, Umbria;\n10 giugno: Basilicata, Piemonte, Toscana, Valle d’Aosta, Trentino-Alto Adige (Trento);\n11 giugno: Liguria\n16 giugno: Trentino-Alto Adige (Bolzano).\nNote\n\nAVVISO  "2025-2026\\2026-05-11_art1241_timbro_aggiornamento_elenco_alunni_ammessi_belvedere_infanzia_11-05-2026_.pdf"}]}, {"art_id": 1240, "date": "2026-05-11", "school_year": "2025-2026", "title": "Sospensione attivita' didattica plesso belvedere infanzia 12 maggio 2026 per intervento derattizzazione straordianria", "topic": "Calendario / Chiusure", "summary": "DISTRETTO SCOLASTICO 42 via F. P. Tosti, no 9 - 80127 - NAPOLI tel./ fax 081. 6134412 / 081 5603942 e mail : naee03800d @istruzione .it 38 C.D. \"G. QUARATI\" - NAPOLI Prot. 0003575 del 11/05/2026 IV (Uscita) OGGETTO: Al…", "excerpt": "DISTRETTO SCOLASTICO 42\nDIREZIONE DIDATTICA del 380 CIRCOLO\nGIUSEPPE QUARATI\"\nvia F. P. Tosti, no 9\n- 80127 - NAPOLI\ntel./ fax 081. 6134412 / 081 5603942\ne mail : naee03800d @istruzione .it\n38 C.D. \"G. QUARATI\" - NAPOLI\nProt. 0003575 del 11/05/2026\nIV (Uscita)\nOGGETTO:\nAl personale Docente\nAl Personale A.T.A.\nPlesso Belvedere Infanzia\nAlle famiglie\nAl SITO\nA1 Portale ARGO\nSOSPENSIONE ATTIVITÀ DIDATTICA PLESSO BELVEDERE\nINFANZIA 12 MAGGIO 2026 PER INTERVENTO Dl\nDERATTIZZAZIONE STRAORDINARIA\nSi comunica che MARTEDÌ 12 MAGGIO 2026 saranno sospese le attività\ndidattiche per tutte le sezioni di scuola dell'Infanzia del plesso Belvedere per un\nintervento di derattizzazione straordinaria\nLe attività riprenderanno MERCOLEDÌ 13/05/2026 alle ore 09.30.\nI docenti svolgeranno regolare servizio, secondo il proprio orario, alla sede Falcone per eventuali\nsostituzioni dei docenti assenti.\nI collaboratori scolastici svolgeranno il servizio secondo l'organizzazione che sarà comunicata\nsuccessivamente.\nDistinti saluti.\nII Diri\nDot\nte\nlastico\nosito", "url": "https://www.cd38napoli.edu.it/categoria/le-circolari/1240/sospensione-attivita-didattica-plesso-belvedere-infanzia-12-maggio-2026-per-intervento-derattizzazione-straordianria/", "methods": ["OCR_WINDOWS_IT"], "attachments": [{"name": "timbro_sospensione_attivita_didattica_plesso_belvedere_infanzia_12_maggio_2026_per_intervento_derattizzazione_straordianria_.pdf", "url": "https://www.cd38napoli.edu.it/public/files/art_1240/timbro_sospensione_attivita_didattica_plesso_belvedere_infanzia_12_maggio_2026_per_intervento_derattizzazione_straordianria_.pdf", "local_path": "2025-2026\\2026-05-11_art1240_timbro_sospensione_attivita_didattica_plesso_belvedere_infanzia_12_maggio_2026_per_intervento_derattizzazione_straordianri.pdf"}]}, {"art_id": 1239, "date": "2026-05-06", "school_year": "2025-2026", "title": "Ordinanza contingibile ed urgente – chiusura scuole di ogni ordine e grado ricadenti nell’intero territorio cittadino per venerdì 8 maggio 2026 in occasione della visita pastorale di sua Santità Papa Leone XIV.", "topic": "Calendario / Chiusure", "summary": "AREA TECNICA PATRIMONIO Servizio Edilizia Scolastica ORDINANZA SINDACALE OGGETTO: Ordinanza contingibile ed urgente – chiusura scuole di ogni ordine e grado ricadenti nell’intero territorio cittadino per venerdì 8 maggi…", "excerpt": "AREA TECNICA PATRIMONIO \nServizio Edilizia Scolastica \n \n1 \n \nORDINANZA SINDACALE \n \nOGGETTO:  Ordinanza contingibile ed urgente – chiusura scuole di ogni ordine e grado ricadenti \nnell’intero territorio cittadino per venerdì 8 maggio 2026 in occasione della visita pastorale \ndi sua Santità Papa Leone XIV. \n \nIL SINDACO \n \nPremesso che: \n- \nin data 8 maggio 2026 si svolgerà a Napoli la visita pastorale di sua Santità Papa Leone XIV, il cui \npercorso si snoderà dalla Rotonda Diaz al Duomo, dal Duomo a Piazza del Plebiscito e, infine, da \nPiazza del Plebiscito alla Rotonda Diaz; \n- \ncon Ordinanza Dirigenziale n. 252 del 30/04/2026 è stato emanato un particolare dispositivo di \ntraffico - dalle ore 09:00 e fino a cessate esigenze dello stesso giorno - nelle strade interessate dal \npercorso della visita pastorale del Santo Padre, al fine di consentire la regolarità e la sicurezza \ndell'evento. \n \nConsiderato che: \n- \nil passaggio dei veicoli a servizio di sua Santità Papa Leone XIV, durante la sua visita pastorale alla \nCittà, interesserà principalmente le strade cittadine già normalmente soggette a traffico intenso nei \ngiorni di svolgimento delle attività didattiche nelle relative scuole, con possibile disagio al servizio di \ntrasporto scolastico e della fornitura dei pasti; \n- \nl’impatto di tale evento sulla viabilità di dette strade impone la necessità - a tutela della sicurezza e \nincolumità dei cittadini - di evitare gli spostamenti degli alunni e del personale addetto nei tragitti \nverso le scuole di ogni ordine e grado. \n \nSu disposizione del Comitato per l’Ordine e la Sicurezza Pubblica, tenutosi in data odierna presso la \nPrefettura U.T.G. di Napoli. \n \nVisto l’art. 54, comma 4, del D. Lgs. 267/2000 e s.m.i, a mente del quale “Il Sindaco, quale Ufficiale del \nGoverno, adotta con atto motivato provvedimenti, contingibili e urgenti nel rispetto dei principi generali dell’ordinamento, al \nfine di prevenire e di eliminare gravi pericoli che minacciano l'incolumità pubblica e la sicurezza urbana”. \n \nRitenuto, pertanto, alla luce della rilevanza dell’evento, doversi disporre la chiusura delle scuole di ogni \nordine e grado, pubbliche e private, compresi gli asili nido, che insistono sull’intero territorio cittadino. \n \nEsperita apposita istruttoria a cura del Dirigente del Servizio Edilizia Scolastica, su indirizzo \ndell’Assessore all’Istruzione e alle Famiglie. \n \nSentiti l’Assessore alla Polizia Municipale e l’Assessora al Turismo e alle Attività Produt", "url": "https://www.cd38napoli.edu.it/categoria/le-circolari/1239/ordinanza-contingibile-ed-urgente-chiusura-scuole-di-ogni-ordine-e-grado-ricadenti-nell-intero-territorio-cittadino-per-venerdi-8-maggio-2026-in-occasione-della-visita-pastorale-di-sua-santita-papa-leone-xiv-/", "methods": ["TESTO_NATIVO"], "attachments": [{"name": "timbro_allegato1778000669_.pdf", "url": "https://www.cd38napoli.edu.it/public/files/art_1239/timbro_allegato1778000669_.pdf", "local_path": "2025-2026\\2026-05-06_art1239_timbro_allegato1778000669_.pdf"}]}, {"art_id": 1238, "date": "2026-04-29", "school_year": "2025-2026", "title": "Comparto e Area Istruzione e Ricerca_ Settore Scuola_ azioni di sciopero per le giornate del 6 e 7 maggio 2026", "topic": "Assemblee / Scioperi", "summary": "Proclamante % Rappresentatività a livello nazionale (1) % voti nella scuola per le elezioni RSU Tipo di sciopero Durata dello sciopero COBAS SCUOLA SARDEGNA nazionale scuola intere giornate COBAS SCUOLA nazionale scuola…", "excerpt": "Proclamante\n% Rappresentatività a livello \nnazionale (1)\n% voti  nella scuola per le  elezioni RSU\nTipo di sciopero\nDurata dello sciopero \nCOBAS SCUOLA SARDEGNA \n0,12%\nnazionale scuola\nintere giornate\nCOBAS SCUOLA \n0.89%\nnazionale scuola\nintere giornate\nUSB PI E SCUOLA\n0,88%\nnazionale scuola\nintere giornate\nFISI-Federazione Italiana Sindacati \nIntercategoriali\n0,04%\nnazionale scuola\nintere giornate\nSindacato sociale di base\n//\nnazionale scuola\nintere giornate\nIpotesi di scheda informativa ad uso delle istituzioni scolastiche e dell'Amministrazione al fine di assolvere agli obblighi di informazione previsti dall'Accordo sullo sciopero nel Comparto Istruzione e \nRicerca del 2 dicembre 2020 (art. 3, co. 5, Accordo)\nSciopero per le intere giornate del 6 e 7 maggio 2026 di tutto il personale docente, ata, educativo e dirigente a tempo determinato e indeterminato in servizio in Italia e all'estero\nRiferimenti identificativi dell'istituzione scolastica\n  Comparto e Area  Istruzione e Ricerca, settore \"Scuola\" - SCIOPERO DEL 6 e 7 MAGGIO 2026\ntutto il personale\nSciopero per l'intera giornata del 7 maggio 2026 del personale Dirigente, docente e ATA degli Istituti Tecnici di tutti gli indirizzi\nMotivazioni dello sciopero: contro i quiz Invalsi, il dimensionamento scolastico,  la scuola della digitalizzazione selvaggia e lo sperpero dei denari del PNRR, gli ultimi CCNL scuola e i tagli dei prossimi \ oduzione \nc.a. Ufficio Acquisti \n \n \n \nOggetto: nodini di mozzarella scaricati in luogo differente \n \nGentile cliente, la mozzarella del fornitore Cerqueta che doveva essere recapitata al \nCentro Cottura di Napoli domenica 12/04 è stata spedita per errore del vettore a Verona. \nPer questo motivo non è stato possibile consegnarla nei tempi previsti. \n \nSe fosse possibile proporre un cambio di menu, potremmo consegnare il prodotto entro \nmercoledì 15/04 al centro cottura di Napoli. \n \nCi scusiamo per la problematica registrata, dovuta a cause non dipendenti dalle nostre \nvolontà. \nAttendiamo vostro riscontro \n \nCordiali saluti \nLeonardo Ciccarella\n\nVIVENDA S.p.a. Società soggetta alle attività di direzione e di coordinamento della\nCooperativa di lavoro La Cascina Soc. Coop. p.a. - P.IVA, Codice Fiscale e\nNumero Iscrizione Registro delle Imprese di Roma 07864721001\nNum. R.EA 1058873 - cap. soc. euro 33.333.334,00 i.v.\nSede legale - Direzione generale\nVia Francesco Antolisei, 25 - 00173 - ROMA\nTel 06 72.99.61 -Fax 06 72.99.62.01\ninfo@vivendaspa.it - vivendaspa@pec.it\nCASCINA\nVivenda\n38 C.D. \"G. QUARATI\" - NAPOLI\nProt. 0002894 del 13/04/2026\nIV (Entrata)\nProt. nr.000106/VIV/2026\nNapoli, 13/04/2026\nAlla cortese attenzione della\nMunicipalità V— Attività Amministrative\nMunicipalità II — Attività Amministrative\nE-mail:\nmunicipalita5.attivita.amministrative@comune.napoli.it\nmunicipalita2.attivita.amministrative@comune.napoli.it\nPEC :\nmunicipalita2@pec.comune.napoli.it\nmunicipalita5@pec.comune.napoli.it\nOggetto: inversione di menu per mancata consegna \"fior di latte bio\"\nCon la presente, la scrivente società comunica che, a seguito di un errore da parte del fornitore in\nmerito alla consegna del prodotto \"mozzarella fior di latte bio\" prevista per il giorno 12/04/26, in data odierna\nin via straordinaria non sarà possibile somministrare tale prodotto, come indicato in menù.\nPertanto, sarà effettuata un cambio di menu: nello specifico, in data odierna sarà somministrato\n\"prosciutto cotto\", mentre nel servizio di domani 14/04/2026 sarà somministrata \"mozzarella fior di latte\"\nconvenzionale.\nSi allega a tal fine dichiarazione del fornitore circa il mancato scarico della merce presso il centro\ncottura.\nVisto il carattere imprevisto della circostanza accaduta, si informa che ad alcune diete differenziate\nriceveranno \"formaggio spalmabile quick\" nella giornata odierna.\nScusandoci per il disagio arrecato non ", "url": "https://www.cd38napoli.edu.it/categoria/le-circolari/1234/nota-vivenda-per-cambio-menu/", "methods": ["OCR_WINDOWS_IT", "TESTO_NATIVO"], "attachments": [{"name": "timbro_mozzarella_vivenda_.pdf", "url": "https://www.cd38napoli.edu.it/public/files/art_1234/timbro_mozzarella_vivenda_.pdf", "local_path": "2025-2026\\2026-04-13_art1234_timbro_mozzarella_vivenda_.pdf"}, {"name": "timbro_nota_mancata_consegna_mozzarella_bio_13_04_2026_.pdf", "url": "https://www.cd38napoli.edu.it/public/files/art_1234/timbro_nota_mancata_consegna_mozzarella_bio_13_04_2026_.pdf", "local_path": "2025-2026\\2026-04-13_art1234_timbro_nota_mancata_consegna_mozzarella_bio_13_04_2026_.pdf"}]}, {"art_id": 1233, "date": "2026-04-13", "school_year": "2025-2026", "title": "Comparto Istruzione e Ricerca_ Scuola_ sciopero per l'intera giornata del 20 aprile 2026", "topic": "Assemblee / Scioperi", "summary": "Proclamante % Rappresentatività a livello nazionale (1) % voti nella scuola per le elezioni Tipo di sciopero Durata dello sciopero SAESE nazionale intera giornata UNICOBAS SCUOLA&UNIVERSITA' nazionale intera giornata da…", "excerpt": "Proclamante\n% Rappresentatività a \nlivello nazionale (1)\n% voti  nella scuola per le  elezioni \nRSU\nTipo di sciopero\nDurata dello \nsciopero \nSAESE\n/\nnazionale\nintera giornata\nUNICOBAS SCUOLA&UNIVERSITA'\n0,14\nnazionale\nintera giornata\na.s.\ndata\nTipo di sciopero\nsolo\ncon altre sigle \nsndacali\n% adesione \nnazionale (2)\n% adesione \nnella scuola\n asversali. \nGli incontri avranno un taglio informativo e riflessivo e saranno pensati come momenti di ascolto, \ncondivisione e dialogo, in cui il confronto all’interno del gruppo potrà rappresentare un valore \naggiunto. \nIl percorso affronterà alcuni aspetti legati allo sviluppo emotivo e relazionale dei bambini, con \nparticolare attenzione alla comprensione delle emozioni, ai bisogni evolutivi e alle risposte \ndell’adulto. \nI contenuti specifici potranno essere modulati in base ai bisogni e alle domande che \nemergeranno nel gruppo. \nGli incontri si svolgeranno in presenza presso la sede Quarati nelle seguenti date e orari: 9 \nmarzo, 16 marzo e 30 marzo dalle ore 16:30 alle ore 18:00. \nGli incontri saranno condotti dalla dott.ssa Paola Rodia, docente dell’Istituto, psicologa dello \nsviluppo e pedagogista con formazione in Mindfulness (MBSR Trainer). \nAl fine di raccogliere le adesioni, individuare il numero indicativo dei partecipanti e conoscere \nle aspettative delle famiglie, si invita a compilare il seguente breve questionario online (Google \nForm): https://forms.gle/9GLtbodcZKz4dE3V7  \nCordiali saluti \n                                                                                                  Il Dirigente Scolastico \n                                                           Dott.ssa Marina Esposito", "url": "https://www.cd38napoli.edu.it/categoria/le-circolari/1223/verso-una-genitorialita-piu-consapevole/", "methods": ["TESTO_NATIVO"], "attachments": [{"name": "timbro_circolare_per_genitori_.pdf", "url": "https://www.cd38napoli.edu.it/public/files/art_1223/timbro_circolare_per_genitori_.pdf", "local_path": "2025-2026\\2026-03-02_art1223_timbro_circolare_per_genitori_.pdf"}]}, {"art_id": 1222, "date": "2026-02-13", "school_year": "2025-2026", "title": "Proroga termine iscrizioni alle scuole dell' infanzia e alle scuole del primo e del secondo ciclo di istruzione per l' anno scolastico 2026/2027", "topic": "Calendario / Chiusure", "summary": "Dipartimento per il sistema educativo di istruzione e formazione Direzione generale per gli ordinamenti scolastici, la formazione del personale scolastico e la valutazione del sistema nazionale di istruzione Viale Trast…", "excerpt": "Ministero dell’istruzione e del merito \nDipartimento per il sistema educativo di istruzione e formazione \nDirezione generale per gli ordinamenti scolastici, la formazione del personale scolastico e la valutazione del \nsistema nazionale di istruzione \n \n \n Viale Trastevere n. 76/A – 00153 Roma – C.F. 80185250588 - Tel. 06/58495996 - dgosvi.ufficio2@istruzione.it \ndgosv@postacert.istruzione.it  \n \nOGGETTO: proroga delle iscrizioni alle scuole dell’infanzia e alle scuole del primo e del \nsecondo ciclo di istruzione per l’anno scolastico 2026/2027 \n \nSi fa seguito alla nota di questa Direzione generale n. 100847 del 17 dicembre 2025 relativa alle \niscrizioni alle scuole dell’infanzia e alle scuole del primo e del secondo ciclo di istruzione per l’anno \nscolastico 2026/2027. \nAl fine di agevolare le famiglie nella scelta del percorso educativo e supportare il lavoro delle \nsegreterie scolastiche, anche in considerazione degli eventi atmosferici e idrogeologici che nelle \nscorse settimane hanno costretto alla sospensione dell’attività didattica e amministrativa le scuole di \nalcuni territori del Paese, si dispone la proroga a livello nazionale della procedura delle iscrizioni \nfissando il nuovo termine di conclusione alle ore 20:00 del giorno 21 febbraio 2026.  \nLe istituzioni scolastiche e gli Uffici di ambito territoriale continueranno a garantire il necessario \nsupporto alle famiglie e a mettere a disposizione le strumentazioni informatiche per i genitori o gli \nesercenti la responsabilità genitoriale che ne fossero sprovvisti. \n \nSi ringrazia per la consueta fattiva collaborazione. \n \n \nIL DIRETTORE GENERALE  \n       Antonella Tozza \n \n \n \n \n \nAi Direttori generali degli Uffici scolastici regionali \ e \ndocente,\neducativo, ATA\nSEDE\nDA TRASMETTERE PER VIA TELEMATICA A TUTTO IL PERSONALE DELLA SCUOLA \nE AFFIGGERE ALL’ALBO SINDACALE ON LINE OVVERO IN APPOSITA SEZIONE DEL \nSITO DELL’ISTITUZIONE SCOLASTICA\nOggetto: convocazione di un’assemblea sindacale, del personale, ai sensi dell’art. 31 del \nCCNL 2019-2021, che si terrà in data 19/02/2026 e si svolgerà nelle prime ore di servizio \ncoincidenti con l’inizio delle attività didattiche, dalle ore 08:00 alle ore 10:00 da \nsvolgersi in presenza.\nLa scrivente Organizzazione Sindacale ANIEF convoca un’assemblea sindacale per tutto il personale docente, \neducativo e ATA a tempo determinato e indeterminato,\nL’assemblea sarà presieduta da STEFANO CAVALLINI, interviene Marcello Pacifico, Presidente \nNazionale ANIEF.\nPunti all’ordine del giorno:\n1. CCNI economie MOF e contrattazione integrativa;\n2. Aumento e arretrati CCNL 2022/24 e controllo cedolini tarocco;\n3. Pensioni, organici, mobilità, reclutamento;\n4. Campagna screening, #nonuneurodimeno;\n5. Piattaforma sindacale ANIEF 2025-2027.\nSi richiede di allegare la presente convocazione alla comunicazione/circolare destinata \nal personale interessato.\nCordiali saluti.\n \nAlessandra Boccanfuso\n\n--- [Pagina successiva] ---\n\nP.zza Don Bosco n.1/b - 90143 Palermo mail sn.urs@anief.net Pec sn.urs@pec.anief.net\n tel. 091.7098360 fax + 39 0915640995\nPresidente provinciale ANIEF Napoli\n\n• CCNI economie MOF e contrattazione integrativa; \n• Aumento e arretrati CCNL 2022/24 e controllo \ncedolini tarocco; \n• Pensioni, organici, mobilità, reclutamento; \n• Campagna screening, #nonuneurodimeno; \n• Piattaforma sindacale ANIEF 2025-2027. \n \n \n19/02/2026 8-10 \nCD QUARATI \n \nPer informazioni: \nRelatore: \nSTEFANO CAVALLINI \n \nIL RINNOVO DEL  \nCCNL 2022-24 \nL’assemblea è rivolta a tutto il personale della scuola. \nI partecipanti hanno diritto all’esonero dal servizio. \n#perunascuolagiusta \nTEMI:\n\nAmbito Scolastico N. 12\n380 Circolo Didattico \"
